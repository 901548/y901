<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Y901 WASM</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    #y901-canvas { display: block; margin: 0 auto; background: #111; }
  </style>
</head>
<body>
  <!-- 页面约定：id 必须是 y901-canvas（见 docs/WASM.md §3.2） -->
  <canvas id="y901-canvas" width="800" height="600"></canvas>

  <script type="module">
    // `?v=` 参数用于破浏览器缓存：每次重建都换一个值。
import init, { y901_start, y901_font_loaded } from './pkg/y901_shell.js?v=s2-p3-fixed';

    async function run() {
      await init();

      // 先出占位帧（零字形），再异步取真字体；字体就绪后换装并全量重绘。
      y901_start();

      try {
        // **字体也要破缓存**：否则浏览器会一直用旧的 Consolas（这就是 SimHei “没生效”的原因）。
        const resp = await fetch('./fonts/default.ttf?v=simhei-2');
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const buf = await resp.arrayBuffer();
        y901_font_loaded(new Uint8Array(buf));
        console.info('[y901] font swapped in');
      } catch (e) {
        console.warn('[y901] 字体加载失败（保持零字形占位）：', e && (e.stack || e.message || e));
      }
    }

    run().catch((err) => console.error('[y901] 初始化失败：', err));
  </script>
</body>
</html>
