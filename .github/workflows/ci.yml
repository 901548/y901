name: CI

# 七块门禁，任一红都不算通过：
#   windows-gate : 完整 scripts/gate.ps1（MSRV/fmt/计数/inventory/clippy/像素哈希/
#                  missing_docs/版本一致/doc 数字/audit）—— 与本地发布前跑的是同一份脚本
#   linux-x11    : scripts/linux-verify.sh 八步（Xvfb 真窗口 + cfg(unix) 代码 + Linux clippy）
#   packaging    : scripts/check-packaging.ps1（12 个 crate 逐个 `cargo package`，不发布）
#   dependency-policy : cargo-deny 校验 deny.toml（安全公告 / 许可 / 来源 / 重复版本）
#   semver-guard : `!` 破坏性提交必须对应 minor/major 升级（scripts/check-semver-bump.ps1）
#   semver-checks: 公开 API 与最近 tag 的签名级兼容性（cargo-semver-checks）
#
# 为什么 CI 要联网：本机脚本默认加 `--offline`（依赖已在缓存）；runner 是干净环境。
# scripts/*.ps1 统一读 `Y901_ONLINE=1` / `gate.ps1 -Online` 来去掉 `--offline`。
#
# 另有 `.github/workflows/consumer.yml`：用 crates.io 上已发布的 y901 编译一个下游工程，
# 专门抓“本地 workspace 全绿、发布版不可用”的问题。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-gate:
    name: Windows gate (fmt / clippy / tests / pixel hash / doc numbers / audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # -SkipGpu：GitHub 的 windows runner 是虚拟机、没有 GPU，D3D 探针会 SKIP。
      # gate 默认不容忍 SKIP（"没跑"不能算"通过"），所以这里显式放行，并在日志里留痕。
      # 退出码：0 = GATE OK；2 = 「通过但不可发布」（这里有 SKIP，属 CI 的预期上限）。
      # 其它非 0 一律视为失败 —— 不能把"门禁红了"读成"环境限制"。
      - name: gate.ps1
        shell: pwsh
        run: |
          ./scripts/gate.ps1 -Online -SkipGpu
          $code = $LASTEXITCODE
          if ($code -eq 2) {
            Write-Host "::notice::gate: 通过但不可发布（无 GPU 导致的 SKIP）；CI 判定成功"
            exit 0
          }
          exit $code
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-logs
          path: |
            target/gate-test.log
            target/gate.log
            target/audit.log
          if-no-files-found: ignore

  linux-x11:
    name: Linux Xvfb (X11 backend + cross-platform crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install X11 test deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: linux-verify.sh
        run: bash scripts/linux-verify.sh
        env:
          # 空 = 联网（CI 没有本地 cargo 缓存）
          CARGO_FLAGS: ""
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-verify-log
          path: |
            /tmp/y901-linux-full.log
            docs/evidence/cross-platform/
          if-no-files-found: ignore

  packaging:
    name: cargo package (12 crates, no publish)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      # 这条能在"合并前"抓到只在发布时才暴露的三类错误：
      #   path 依赖漏写 version / categories slug 非法 / re-export 指向未发布路径。
      - name: check-packaging.ps1
        shell: pwsh
        run: ./scripts/check-packaging.ps1 -Online

  dependency-policy:
    name: cargo-deny (advisories / licenses / bans / sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本固定成 0.21.0：0.22+ 要求 rustc 1.95，与本仓库 MSRV 1.92 不符。
      - name: Install cargo-deny 0.21.0
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.21.0
      # deny.toml 的 ignore 只覆盖 docs/DEPENDENCIES.md 里已决策的维护性公告；
      # 新增漏洞/许可/来源问题必须在这里变红，而不是靠人肉 review。
      - name: cargo deny check
        run: cargo deny check

  text-shaping:
    name: text shaping (rustybuzz + bidi + clusters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      # `shaping` 是可选 feature（默认构建仍走 cell 路径，像素基线不变），
      # 所以必须有独立 job 真正编译并跑它，否则"支持复杂文本"只是注释里的承诺。
      - name: cargo test -p y901-render --features shaping
        run: cargo test -p y901-render --features shaping --lib
      # 零 C 守卫在 feature 打开时也要成立：rustybuzz 是纯 Rust，但它的依赖树必须复核。
      - name: zero-C guard under shaping feature
        run: |
          cargo tree -p y901-render --features shaping --prefix none --no-dedupe \
            | sort -u > /tmp/shaping-tree.txt
          if grep -Eq '(^|[[:space:]])(cc|cmake|bindgen|ring|openssl-sys|harfbuzz-sys|freetype-sys)([[:space:]]|$)' /tmp/shaping-tree.txt; then
            echo "::error::shaping 依赖树里出现 C/C++ 构建依赖"
            grep -E '(^|[[:space:]])(cc|cmake|bindgen)([[:space:]]|$)' /tmp/shaping-tree.txt
            exit 1
          fi
          echo "shaping 依赖树无 C/C++ 构建依赖"

  a11y-bridge:
    name: accessibility bridge (AccessKit mapping + platform adapters)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            feature: windows-uia
          - os: ubuntu-latest
            feature: unix-atspi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      # 每个平台编它自己的适配器：Windows 走 UIA（accesskit_windows），
      # Linux 走 AT-SPI（accesskit_unix）。两者都是纯 Rust，但必须真编一遍。
      - name: cargo test -p y901-a11y
        run: cargo test -p y901-a11y --lib --features ${{ matrix.feature }}
      # 零 C 复核：无障碍依赖树里不能出现 C/C++ 构建工具。
      - name: zero-C guard
        shell: bash
        run: |
          cargo tree -p y901-a11y --features ${{ matrix.feature }} --prefix none --no-dedupe \
            | sort -u > /tmp/a11y-tree.txt
          if grep -Eq '(^|[[:space:]])(cc|cmake|bindgen|ring|openssl-sys|harfbuzz-sys|freetype-sys)([[:space:]]|$)' /tmp/a11y-tree.txt; then
            echo "::error::无障碍依赖树里出现 C/C++ 构建依赖"
            grep -E '(^|[[:space:]])(cc|cmake|bindgen)([[:space:]]|$)' /tmp/a11y-tree.txt
            exit 1
          fi
          echo "无障碍依赖树无 C/C++ 构建依赖"
  web-aria:
    name: web ARIA mirror (wasm32 + a11y feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.92 + wasm32 target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Web 的无障碍是"隐藏 DOM 镜像"，不在 AccessKit 那条路上；
      # 只在 wasm32 下编译，所以必须有独立 job 真编一遍。
      - name: cargo check -p y901-backend-web --features a11y
        run: cargo check -p y901-backend-web --features a11y --target wasm32-unknown-unknown
      # 默认构建也要编：`aria` 字段与推送调用点都是 `#[cfg(feature)]` 掉的，
      # 只测开 feature 的一侧，关掉 feature 的构建坏了也看不见。
      - name: cargo check -p y901-backend-web (default features)
        run: cargo check -p y901-backend-web --target wasm32-unknown-unknown
      # 映射与"指纹去重"是纯逻辑，能在宿主机上单测；DOM 行为只能靠真实浏览器，这里不做。
      - name: cargo test -p y901-a11y
        run: cargo test -p y901-a11y
      # 门面转发：`y901-shell/a11y` 必须真的把 `y901-backend-web/a11y` 打开，
      # 否则浏览器用户开了 feature 仍然读不到任何东西（镜像代码根本没参与编译）。
      - name: cargo check -p y901-shell --features a11y (wasm32)
        run: cargo check -p y901-shell --features a11y --target wasm32-unknown-unknown
      # **单入口门面必须在 wasm32 上成立**：它经由 `y901-extras` 间接依赖 PTY 链
      # （portable-pty → filedescriptor），而那条链在 wasm32 上编译不过。
      # extras 已按 target 门控掉 PTY；这一步守住"门面不退化回桌面专用"。
      - name: cargo check -p y901 (facade, wasm32)
        run: cargo check -p y901 --target wasm32-unknown-unknown
      - name: cargo check -p y901 (facade + a11y, wasm32)
        run: cargo check -p y901 --features a11y --target wasm32-unknown-unknown
      # 反向守卫：PTY 依赖真的**还在**宿主机上，没有被 target 门控误删。
      - name: portable-pty still resolves on the host target
        run: cargo tree -p y901-extras -i portable-pty
  semver-guard:
    name: semver guard (breaking `!` commits require minor/major bump)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 脚本要读最近 tag 到 HEAD 的提交，浅 clone 拿不到 tag 历史。
          fetch-depth: 0
      - name: check-semver-bump.ps1
        shell: pwsh
        run: ./scripts/check-semver-bump.ps1

  semver-checks:
    name: cargo-semver-checks (public API vs latest tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2
      # 0.50+ 要求 rustc 1.93；0.49 支持 1.91，匹配本仓库 MSRV 1.92。
      - name: Install cargo-semver-checks 0.49.0
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.49.0
      # 基线是最近 tag（分支保护里 tag 与发布内容一致）。
      # 0.x 的约定是"破坏性变更升 minor"，所以 semver-checks 失败时再跑一次
      # check-semver-bump：只要版本确实升了 minor/major，本 job 判为预期失败（记 notice）。
      # 版本仍是 patch 却报破坏性变更 → 真正失败（这正是历史上 v0.2.1 踩过的坑）。
      - name: cargo semver-checks
        run: |
          baseline="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          echo "baseline=$baseline"
          # **排除新增 crate**：它们在上一个 tag 里不存在，无从比较（会报 "crate not found"）。
          if cargo semver-checks check-release --workspace --exclude y901-a11y --baseline-rev "$baseline"; then
            exit 0
          fi
          echo "::warning::semver-checks 报告破坏性变更，检查版本号是否已升 minor/major"
          pwsh -NoProfile -File ./scripts/check-semver-bump.ps1
