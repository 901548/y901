name: Perf gate

# 性能断言默认**不强制**（共享机器/CI runner 的墙钟时间不可靠，见
# crates/y901-ui/tests/grid_perf.rs 的注释）。这个 workflow 才是"强制模式"：
# 在专用、空闲的 runner 上设 `Y901_PERF_GATE=1`，让那些 assert 真的生效。
#
# 为什么不放进 push 门禁：push 门禁要的是确定性；性能是趋势指标，
# 放在定时/手动触发里更合适（红了先怀疑机器，再怀疑代码）。

on:
  schedule:
    # 每天 03:17 UTC（避开整点拥堵）
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 强制性能断言：超过预算即失败（这就是本 workflow 唯一的意义）
  Y901_PERF_GATE: "1"

jobs:
  perf:
    name: Perf (Y901_PERF_GATE=1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
      - uses: Swatinem/rust-cache@v2

      # **先把依赖抓全，再跑基准**。
      #
      # 为什么单独一步：基准脚本为本地速度会先试 `--offline`，而 CI runner 的
      # registry 缓存可能是冷的 —— 之前就因此整条 Perf gate 红过
      # （4 项全报 `failed to download`，看起来像性能退化）。
      # 这一步把"网络/依赖"问题隔离出来，红了就是网络，而不是性能。
      - name: cargo fetch（预热依赖，失败会单独报错）
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            cargo fetch --locked
            if ($LASTEXITCODE -eq 0) { Write-Host "cargo fetch ok (attempt $i)"; exit 0 }
            Write-Host "cargo fetch 失败（第 $i 次），10s 后重试"
            Start-Sleep -Seconds 10
          }
          Write-Host "::error::cargo fetch 连续 3 次失败：这是网络/依赖问题，不是性能退化"
          exit 1

      # release 构建才有意义（debug 阈值留了 10~20 倍余量，只能挡"数量级退化"）
      #
      # **与本地共用同一个脚本**：这里不再逐个列 cargo 命令，
      # 否则 CI 与本地的"怎么测"会慢慢分叉（哪边加了 `--include-ignored`、哪边忘了 `-p`）。
      - name: perf-gate.ps1（4 项基准，强制阈值）
        shell: pwsh
        run: ./scripts/perf-gate.ps1

      # 结果汇总到 job summary，方便看趋势（不用点开每条 log）
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "### Perf gate" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 强制阈值：\`grid_perf\`（release 6ms / debug 60ms）" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 其余 bench 只打印数字，不做断言" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "- 结论：${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY
