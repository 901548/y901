# cargo-deny policy for the current Y901 workspace dependency tree.
# Use `cargo deny check` to evaluate advisories, licenses, bans, and sources.
# **按全部 feature 建图**：shaping 是可选 feature，默认图里没有 rustybuzz，
# 于是它的许可/公告/来源策略根本不会被检查（cargo-deny 会报 advisory-not-detected）。
# 打开全部 feature 才能让策略覆盖真正可能被编译的依赖。
[graph]
all-features = true

[advisories]
# Do not fail on these known, documented maintenance advisories. They are
# accepted warnings under the current policy, not claims that the crates are
# safe or advisories are resolved. Re-evaluate before removing either ignore.
# RUSTSEC-2017-0008: serial 0.4.0, required by portable-pty 0.8.1; see
# docs/DEPENDENCIES.md (upgrade portable-pty and validate its PTY API first).
# RUSTSEC-2026-0192: ttf-parser 0.25.1 is unmaintained, not a known vuln;
# see docs/DEPENDENCIES.md for attack surface and re-evaluation conditions.
# RUSTSEC-2026-0441: pin-utils 0.1.1 is a macro-only transitive dependency of
# nix (via portable-pty and rustbus), not a known vuln; see docs/DEPENDENCIES.md.
# RUSTSEC-2026-0206: rustybuzz 0.20.1 is unmaintained, only pulled in by the
# optional `shaping` feature (pure-Rust HarfBuzz port); the alternatives are a
# C++ dependency (harfbuzz-sys, breaks the zero-C guard) or reimplementing
# OpenType shaping. Not a known vuln; see docs/DEPENDENCIES.md.
# RUSTSEC-2026-0370 / -0371 / -0372: zvariant, zbus_names, zvariant_derive.
# These are the D-Bus type/name layer under zbus, pulled in only by the
# optional `unix-atspi` bridge (accesskit_unix). No C dependency, no known vuln;
# the alternative is hand-writing AT-SPI over our own D-Bus client. Re-evaluate
# when zbus moves off the archived zvariant. See docs/DEPENDENCIES.md.
ignore = [
    "RUSTSEC-2017-0008",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    "RUSTSEC-2026-0441",
]

[licenses]
# Licenses actually encountered in the current dependency tree: Apache-2.0,
# 0BSD, MIT, Unicode-3.0, Zlib. cargo-deny warns about allowances that match
# nothing, so add a license here only when a dependency really needs it.
allow = [
    "Apache-2.0",
    "0BSD",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Multiple semver-compatible versions are currently present in the lockfile;
# keep them visible without blocking existing CI until explicitly reviewed.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
