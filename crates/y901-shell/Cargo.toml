[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Platform selection and OS adapters (clipboard, secrets) for Y901."
name = "y901-shell"
version.workspace = true
edition.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
y901-backend-win32 = { path = "../y901-backend-win32", version = "0.1.19" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
y901-backend-x11 = { path = "../y901-backend-x11", version = "0.1.19" }

[dependencies]
y901-runtime = { path = "../y901-runtime", version = "0.1.19" }
# 截图编码（纯 Rust）
png = "0.17"
y901-ui = { path = "../y901-ui", version = "0.1.19" }
y901-widgets = { path = "../y901-widgets", version = "0.1.19" }
