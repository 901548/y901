[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Platform selection and OS adapters (clipboard, secrets) for Y901."
name = "y901-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "terminal", "application"]
categories = ["command-line-utilities", "gui"]

[target.'cfg(target_os = "windows")'.dependencies]
y901-backend-win32 = { path = "../y901-backend-win32", version = "0.3.0" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
y901-backend-x11 = { path = "../y901-backend-x11", version = "0.3.0" }

[dependencies]
y901-runtime = { path = "../y901-runtime", version = "0.3.0" }
# 截图编码（纯 Rust）
png = "0.17"
y901-ui = { path = "../y901-ui", version = "0.3.0" }
y901-render = { path = "../y901-render", version = "0.3.0" }
y901-widgets = { path = "../y901-widgets", version = "0.3.0" }

# **仅 wasm32**：浏览器后端。桌面构建完全不依赖它。
[target.'cfg(target_arch = "wasm32")'.dependencies]
# version 必须写：crates.io 打包要求所有依赖都有版本约束（path 会被剥掉）。
# 少了它 `cargo publish -p y901-shell` 会直接失败：
#   "all dependencies must have a version requirement specified when packaging"
y901-backend-web = { path = "../y901-backend-web", version = "0.3.0" }
y901-runtime = { path = "../y901-runtime", version = "0.3.0" }
y901-ui = { path = "../y901-ui", version = "0.3.0" }
y901-render = { path = "../y901-render", version = "0.3.0" }
wasm-bindgen = "0.2"

# wasm-pack 需要 cdylib 才能产出 .wasm；rlib 保留给桌面示例与测试链接。
[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "shell_hello"
path = "examples/hello.rs"

[features]
default = []
# 转发到平台后端的无障碍桥（Windows UIA / Linux AT-SPI）。
# 为什么要在 shell 转发：示例与用户应用都从 `create_runtime()` 走，
# 只有一路转发特征，普通用户才不用直接依赖 `y901-backend-*`。
a11y = ["y901-backend-win32/a11y", "y901-backend-x11/a11y"]
