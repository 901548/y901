[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Win32 / D3D11 backend for Y901."
name = "y901-backend-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "win32", "d3d11", "directwrite"]
categories = ["gui", "os"]

[dependencies]
y901-core = { path = "../y901-core", version = "0.3.0" }
y901-ui = { path = "../y901-ui", version = "0.3.0" }
y901-runtime = { path = "../y901-runtime", version = "0.3.0" }
y901-render = { path = "../y901-render", version = "0.3.0" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
  "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
y901-widgets = { path = "../y901-widgets", version = "0.3.0" }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
