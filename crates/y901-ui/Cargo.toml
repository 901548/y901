[package]
name = "y901-ui"
version.workspace = true
edition.workspace = true

# 框架核心：零依赖。
# 不认识 D3D11，不认识 PTY，不认识 Win32，也不认识任何具体业务。
# 所有平台能力经 trait 由应用层注入；所有业务语义由应用层解释。
[dependencies]
# 布局原语（区间集）放在 core：它是纯数据，且不依赖本 crate（无循环）。
# 代价：ui 因此间接引入 core 的依赖 `unicode-width`。
y901-core = { path = "../y901-core" }

[dev-dependencies]
y901-render = { path = "../y901-render" }
y901-agent = { path = "../y901-agent" }
