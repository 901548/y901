[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Widget tree, layout, events and theming for Y901."
name = "y901-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "widgets", "layout", "retained-mode"]
categories = ["gui"]

# 框架核心：零**外部**依赖（只依赖内部 crate `y901-core`）。
# 不认识 D3D11，不认识 PTY，不认识 Win32，也不认识任何具体业务。
# 所有平台能力经 trait 由应用层注入；所有业务语义由应用层解释。
[dependencies]
# wasm 上 `std::time::Instant::now()` 会 panic（time not implemented）；
# `web_time::Instant` 与它 API 一致，native 上直接转发给 std。
web-time = "1"
# 布局原语（区间集）放在 core：它是纯数据，且不依赖本 crate（无循环）。
# 代价：ui 因此间接引入 core 的依赖 `unicode-width`。
y901-core = { path = "../y901-core", version = "0.2.5" }

# 注意：**这里不能有 y901-render 的 dev-dependency**。
# `y901-render` 正常依赖本 crate，若本 crate 再（哪怕是 dev）依赖它，就形成
# ui → render → ui 的环：crates.io 首次发布时无论先发哪个都会因"对方还不存在"失败
# （cargo 打包/发布时会解析 dev-dependencies）。需要真像素回读的用例放在
# `crates/y901-render/tests/ui_*.rs`（那里两边都可用）。
