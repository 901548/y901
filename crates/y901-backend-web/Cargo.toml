[package]
name = "y901-backend-web"
description = "Y901 browser (wasm32) backend: canvas presentation, DOM input, rAF pacing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "wasm", "webassembly", "canvas"]
categories = ["gui", "wasm"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"

[dependencies]
y901-core = { path = "../y901-core", version = "0.4.0" }
y901-ui = { path = "../y901-ui", version = "0.4.0" }
y901-render = { path = "../y901-render", version = "0.4.0" }
y901-runtime = { path = "../y901-runtime", version = "0.4.0" }
# **不依赖 web-sys**：canvas / 事件 / rAF 绑定手写在 src/bindings.rs（约 120-150 行），
# 避免 web-sys 带来的编译时间膨胀（见 docs/WASM.md 决策 D6）。
wasm-bindgen = "0.2"
# 无障碍：语义树 → 隐藏 DOM 的 ARIA 镜像（纯映射层在 y901-a11y）。
y901-a11y = { path = "../y901-a11y", version = "0.4.0", optional = true }

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"

[features]
# 给 canvas 挂一份隐藏的 ARIA 镜像 DOM（读屏器可见）。
a11y = ["dep:y901-a11y"]
