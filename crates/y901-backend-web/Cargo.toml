[package]
name = "y901-backend-web"
description = "Y901 browser (wasm32) backend: canvas presentation, DOM input, rAF pacing"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"

[dependencies]
y901-core = { path = "../y901-core", version = "0.2.4" }
y901-ui = { path = "../y901-ui", version = "0.2.4" }
y901-render = { path = "../y901-render", version = "0.2.4" }
y901-runtime = { path = "../y901-runtime", version = "0.2.4" }
# **不依赖 web-sys**：canvas / 事件 / rAF 绑定手写在 src/bindings.rs（约 120-150 行），
# 避免 web-sys 带来的编译时间膨胀（见 docs/WASM.md 决策 D6）。
wasm-bindgen = "0.2"

[lib]
crate-type = ["cdylib", "rlib"]