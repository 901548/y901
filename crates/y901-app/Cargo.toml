[package]
name = "y901-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "y901"
path = "src/main.rs"

# 应用壳：建树 + 平台后端 + RPC。
# 不实现组件逻辑（y901-widgets），也不定义布局规则（y901-ui）。
[dependencies]
y901-backend-win32 = { path = "../y901-backend-win32" }
y901-shell = { path = "../y901-shell" }
y901-runtime = { path = "../y901-runtime" }
y901-ui = { path = "../y901-ui" }
y901-widgets = { path = "../y901-widgets" }

