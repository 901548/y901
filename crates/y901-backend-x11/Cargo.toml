[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "X11 backend for Y901."
name = "y901-backend-x11"
version.workspace = true
edition.workspace = true

# 零 C 依赖：只用 std + 本仓库的纯 Rust crate。
# 不引入 x11 / xcb / x11rb —— 这是整个自研方案的前提。
[dependencies]
# 键盘事件要映射成 `y901_ui::Key` / `Modifiers`，所以需要它（纯 Rust、零外部依赖）
y901-ui = { path = "../y901-ui", version = "0.2.4" }
# 事件要汇成 `RawEvent`，`Presenter` 要实现 runtime 的 trait
y901-runtime = { path = "../y901-runtime", version = "0.2.4" }
y901-render = { path = "../y901-render", version = "0.2.4" }

[target."cfg(unix)".dependencies]
# 纯 Rust D-Bus 实现（容忍 IBus 不合规的 sender 字段；zbus 会直接 panic）
rustbus = "0.19"
# 事件循环骨架与窗口抽象（与 Win32 共用的部分）
