[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Platform contracts (Host, PlatformRuntime, RawEvent) for Y901."
name = "y901-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "runtime", "windowing"]
categories = ["gui"]

[dependencies]
# wasm 上 `std::time::Instant::now()` 会 panic（time not implemented）；
# `web_time::Instant` 与它 API 一致，native 上直接转发给 std。
web-time = "1"
y901-ui = { path = "../y901-ui", version = "0.2.6" }

[dev-dependencies]
y901-widgets = { path = "../y901-widgets", version = "0.2.6" }
