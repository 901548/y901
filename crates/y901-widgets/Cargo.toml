[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Reusable widgets (Button, TextInput, Table, Dialog, Alert, ...) for Y901."
name = "y901-widgets"
version.workspace = true
edition.workspace = true

[dependencies]
# PNG decode: pure Rust (png -> flate2 -> miniz_oxide). Zero C.
png = "0.17"
y901-core = { path = "../y901-core", version = "0.1.0" }
y901-ui = { path = "../y901-ui", version = "0.1.0" }

[dev-dependencies]
y901-render = { path = "../y901-render", version = "0.1.0" }
