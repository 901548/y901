[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Reusable widgets (Button, TextInput, Table, Dialog, Alert, ...) for Y901."
name = "y901-widgets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "widgets", "ui"]
categories = ["gui"]

[dependencies]
# wasm 上 `std::time::Instant::now()` 会 panic（time not implemented）；
# `web_time::Instant` 与它 API 一致，native 上直接转发给 std。
web-time = "1"
# PNG decode: pure Rust (png -> flate2 -> miniz_oxide). Zero C.
png = "0.18"
y901-core = { path = "../y901-core", version = "0.5.0" }
y901-ui = { path = "../y901-ui", version = "0.5.0" }

[dev-dependencies]
y901-render = { path = "../y901-render", version = "0.5.0" }
# 无障碍语义回归测试要直接检查 AccessKit 节点（角色/名字/值），
# 所以测试里依赖 y901-a11y —— 只是 dev-dependency，不改变对外依赖面。
y901-a11y = { path = "../y901-a11y", version = "0.5.0" }
