[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Platform-independent rendering for Y901 (soft backend, font engine, atlas, mip)."
name = "y901-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "rendering", "font", "rasterizer"]
categories = ["graphics", "gui"]

# 关键约束：**不依赖 windows-sys**，只依赖纯 Rust 的 ui 与 ttf-parser。
# 这样它才能被 Windows / X11 / 未来的 macOS 后端共用。
#
# 文本 shaping（S2）的依赖全部是**纯 Rust**，不破零 C 守卫：
# - rustybuzz：HarfBuzz 的 Rust 移植，复用我们已钉的 ttf-parser 0.25；
# - unicode-bidi / unicode-script：双向文本与脚本切分。
[dependencies]
y901-ui = { path = "../y901-ui", version = "0.5.0" }
y901-core = { path = "../y901-core", version = "0.5.0" }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
# `hardcoded-data` 是默认 feature：它带内置的 bidi class 表，
# 关掉它就必须自己提供 BidiDataSource（`BidiInfo::new` 也不可用）。
unicode-bidi = "0.3"
unicode-script = "0.5"

# rustybuzz 只在启用 `shaping` feature 时编译：默认构建仍走"逐字符 cell"路径，
# 保证既有像素基线与启动时间不变；需要复杂文本的应用显式开启。
[features]
default = []
shaping = ["dep:rustybuzz"]

[dependencies.rustybuzz]
version = "0.20"
optional = true
