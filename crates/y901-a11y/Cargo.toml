[package]
license = "MIT OR Apache-2.0"
repository = "https://github.com/901548/y901"
description = "Accessibility bridge for Y901:语义树 → AccessKit（Windows UIA / Linux AT-SPI / Web ARIA 的共同底座）。"
name = "y901-a11y"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["gui", "accessibility", "a11y", "accesskit"]
categories = ["gui", "accessibility"]

# 纯 Rust：`accesskit` 只定义跨平台的无障碍树与动作，不含任何 C 绑定；
# 具体平台适配（UIA / AT-SPI / DOM）由各后端按需依赖 `accesskit_windows` 等。
[dependencies]
y901-ui = { path = "../y901-ui", version = "0.5.0" }
accesskit = "0.25"

# 平台适配器：**都是纯 Rust**（accesskit_windows 只依赖 windows/windows-core 绑定，
# accesskit_unix 走 zbus 纯 Rust D-Bus），不破零 C 守卫。
# 用 feature 门控，避免每个平台都拉一整套无关依赖。
[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = { version = "0.24", optional = true }

[features]
default = []
# Windows UIA 桥：把 AddSubclass 包装成"给 HWND 挂/摘无障碍树"。
windows-uia = ["dep:accesskit_windows", "dep:windows"]
# Linux AT-SPI 桥（D-Bus）。
unix-atspi = ["dep:accesskit_unix"]
