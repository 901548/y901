[workspace]
resolver = "2"
default-members = ["crates/y901-shell"]
members = [
    "crates/y901-core",
    "crates/y901-ui",
    "crates/y901-widgets",
    "crates/y901-extras",
    "crates/y901-runtime",
    "crates/y901-backend-win32",
  "crates/y901-backend-web",
    "crates/y901-shell",
    "crates/y901-backend-x11",
    "crates/y901-render",
]

[workspace.package]
version = "0.2.5"
edition = "2021"
# 给 crates.io / docs.rs 与下游一个明确的 MSRV（scripts/gate.ps1 第 1 步就卡这个值）。
rust-version = "1.92"
